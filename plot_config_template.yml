input_type: V2G  # Only V2G-QUESTS-PSOM SQLite results are supported
input_dir: output  # Folder containing result.sqlite, relative to the V2G-QUESTS-PSOM folder V2G.py runs in (or an absolute path)

# Tables to load (V2G-QUESTS-PSOM result tables are mapped to these names by the data loader)
tables:
  - rp                # Single dummy period (V2G-QUESTS-PSOM has no representative periods)
  - k                 # Time steps (Time)
  - i                 # Nodes/buses (Buses)
  - g                 # Generators (derived from gi)
  - gi                # Generator-node mapping (PV_Buses, Wind_Buses, Hydro_Buses)
  - la                # Lines/branches (Branches)
  - vLineP            # Active power flow
  - vLineQ            # Reactive power flow (optional)
  - vGenP             # Generation (vProd_PV, vProd_Wind, vProd_Hydro)
  - pDemand           # Nodal demand
  - vSOCP_cii         # Voltage magnitude (from vCii)
  - pPmax             # Line thermal limits (pPmax_line)
  - vStIntraRes       # Battery state of charge (vSOC_Batt)
  - coords            # Node coordinates (lat/lon)
  - voltage_bounds    # Voltage bounds per node (Vmax/Vmin)
  - ev                # Electric vehicles set
  - ev_availability   # EV availability at nodes (pAvailable)
  - vDchEV            # EV discharge
  - vChEV             # EV charge
  - vSocEV            # EV state of charge

dropdown_options_y:
  - label: "Y: Dispatch"
    value: "dispatch"
  - label: "Y: Power Flow"
    value: "power_flow"
  - label: "Y: Demand"
    value: "demand"

dropdown_options_x:
  - label: "X: Time"
    value: "time"
  - label: "X: Generator"
    value: "generator"
  - label: "X: Line"
    value: "line"

map_options:
  line_weight: 2
  default_zoom: 5
  arrow_zoom_scale: 0.5
  arrow_min_size: 0.5
  pie_chart_min_radius: 8
  pie_chart_max_radius: 16

  # Optional: CARTO now requires an API key to remove the watermark from the
  # basemap tiles (both the live map and exported SVG/PDF/PNG). Get a free key
  # at https://carto.com/ and paste it here. Leave empty to keep using the
  # basemap without a key (tiles still work, just show CARTO's watermark).
  carto_api_key: ""

  technology_colors:
    Wind: "#2ecc71"
    Solar: "#27ae60"
    RoR: "#21618c"
    Hydro: "#2878ad"
    BESS: "#7f8c8d"
    "BESS Discharge": "#bdc3c7"
    V2G_charging: "#8e44ad"
    V2G_discharging: "#9b59b6"
    unknown: "#808080"
    no_generation: "#000000"

  cluster_options:
    cluster_radius: 60
    maxZoom: 16


graph_options:
  graph_save_options:
    toImageButtonOptions:
      format: svg
      filename: custom_image
      height: 500
      width: 700
      scale: 1

  layout:
    xaxis:
      domain: [ 0, 0.85 ]
      title:
        font:
          size: 18
          color: black
    yaxis:
      domain: [ 0, 1 ]
      title:
        font:
          size: 18
          color: black
    legend:
      x: 0.85
      y: 1
      xanchor: left
      yanchor: top
    margin:
      l: 0
      r: 40
      t: 40
      b: 40
    paper_bgcolor: "#E1EDED"
    plot_bgcolor: "#E1EDED"
    font:
      size: 14
    title:
      x: 0.5
  colors:
    - "#2E86AB"
    - "#F6C85F"
    - "#6F4E7C"
